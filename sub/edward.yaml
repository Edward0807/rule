# =======================================================
# 1. YAML 锚点定义区 (必须放在最前面)
# =======================================================
x-anchors:
  pr: &pr {type: select, proxies: [🚀 节点选择, 🌐 全部节点, 🇯🇵 日本节点, 🇺🇸 美国节点, 🇳🇱 荷兰节点, 🏳️‍🌈 edward, 全球直连]}
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# =======================================================
# 2. 全局与核心配置
# =======================================================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7894
tproxy-port: 7893
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true

external-controller: 127.0.0.1:10086
secret: "123456"
external-ui: "ui"

find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 30

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"

tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  cache-algorithm: arc
  listen: "[::]:1053"
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "time.*.com"
    - "+.pool.ntp.org"
    - "+.ntp.tencent.com"
    - "+.ntp1.aliyun.com"
    - "+.ntp.ntsc.ac.cn"
    - "+.cn.ntp.org.cn"
    - "+.yfsp.tv"
    - "+.iyf.tv"
    - "+.clawcloudrun.com"
    - "+.163.com"
    - "+.126.net"
    - "+.netease.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# 预设直连节点（机场节点将由 Subconverter 自动追加到此列表下方）
proxies:
  - name: "全球直连"
    type: direct
    udp: true

# =======================================================
# 3. 策略组 (利用 include-all 和 filter 自动吸纳节点)
# =======================================================
proxy-groups:
  - {name: 🚀 节点选择, type: select, proxies: [♻️ 自动选择-jp, ♻️ 自动选择-us, 🌐 全部节点, 🇯🇵 日本节点, 🇺🇸 美国节点, 🇳🇱 荷兰节点, 🏳️‍🌈 edward, 全球直连]}
  - {name: 🤖 GeminiGoogle, type: select, proxies: [🌐 全部节点, 🇯🇵 日本节点, 🇺🇸 美国节点, 🇳🇱 荷兰节点, 🏳️‍🌈 edward, 🚀 节点选择]}
  - {name: 📹 YouTube, <<: *pr}
  - {name: 🤖 AI, type: select, proxies: [🌐 全部节点, 🇯🇵 日本节点, 🇺🇸 美国节点, 🇳🇱 荷兰节点, 🏳️‍🌈 edward, 🚀 节点选择]}
  - {name: 👨🏿‍💻 GitHub, <<: *pr}
  - {name: 🐬 OneDrive, <<: *pr}
  - {name: 🪟 Microsoft, <<: *pr}
  - {name: 🎵 TikTok, <<: *pr}
  - {name: ✖️ twitter, type: select, proxies: [🌐 全部节点, 🇯🇵 日本节点, 🇺🇸 美国节点, 🇳🇱 荷兰节点, 🏳️‍🌈 edward, 🚀 节点选择]}
  - {name: 📲 Telegram, <<: *pr}
  - {name: 🎥 NETFLIX, <<: *pr}
  - {name: ✈️ Speedtest, <<: *pr}
  - {name: 💶 PayPal, <<: *pr}
  - {name: 🍎 Apple, type: select, proxies: [全球直连, 🚀 节点选择]}
  - {name: 🎯 全球直连, type: select, proxies: [全球直连, 🚀 节点选择]}
  - {name: 🐟 漏网之鱼, <<: *pr}
  
  # --- 动态正则抓取节点池 ---
  - {name: ♻️ 自动选择-jp, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|hy2|NL|us)).)*$"}
  - {name: ♻️ 自动选择-us, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连|hy2|NL|jp)).)*$"}
  - {name: 🌐 全部节点, type: select, include-all: true}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: 🇺🇸 美国节点, type: select, include-all: true, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: 🇳🇱 荷兰节点, type: select, include-all: true, filter: "(?=.*(荷|NL|(?i)Nederland))^((?!(港|台|日|韩|新|美)).)*$"}
  - {name: 🏳️‍🌈 edward, type: select, include-all: true}

